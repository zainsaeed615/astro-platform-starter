name: Deploy Mindfulness Mockup

on:
  push:
    branches:
      - cursor/mindfulness-mockup-176d
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare static mockup build
        run: |
          rm -rf src/pages/api src/pages/blobs src/pages/edge src/pages/image-cdn src/pages/revalidation.astro

      - name: Build static mockup
        run: npm run build
        env:
          STATIC_DEPLOY: true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Deploy Mindfulness Candle mockup
